<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="8" viewBox="0 0 1000 8" role="presentation">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e05397" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#e05397"/>
      <stop offset="0.75" stop-color="#7b4bd6"/>
      <stop offset="1" stop-color="#7b4bd6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="3" width="1000" height="2" rx="1" fill="url(#line)"/>
  <rect x="-160" y="2" width="160" height="4" rx="2" fill="url(#shine)">
    <animate attributeName="x" values="-160;1000" dur="3.5s" repeatCount="indefinite"/>
  </rect>
</svg>
